## JEI (mezz.jei, BlameJared maven) — common API recipe-viewer compat. NeoForge/Fabric load the loader
## artifacts in dev; the Forge cells compile against the common API only.
jei_version_1.21.1=19.70.0.468
jei_version_1.21.4=20.0.0.4
jei_version_1.21.5=21.4.0.27
jei_version_1.21.8=24.2.0.6
jei_version_1.21.10=26.3.0.31
jei_version_1.21.11=27.54.0.115
# JEI has no Fabric build for Minecraft 1.21.4; that Fabric cell compiles against JEI's common API only.
jei_fabric_1.21.4=false
jei_version_26.1.2=29.47.0.109
jei_version_26.2=30.42.0.236
jei_version_26.3=31.12.0.65

## EMI — optional recipe-viewer compat (compat/emi). Official EMI has no MC 26.x release, so this pins the
## community "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api
## unchanged), fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells
## compile against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
## Minecraft 1.21.x: official EMI (dev.emi, TerraformersMC maven) exists only for 1.21.1; the other 1.21.x
## lines have no EMI at all, so their jars leave compat/emi out.
emi_version_1.21.1=1.1.24+1.21.1
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroTech).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## GitHub Packages in CI/fresh clones, or mavenLocal() for local dev (run `./gradlew publishToMavenLocal`
## in ../neroland-core). This version must exist in one of those — see ../neroland-core/USING-CORE.md.
nerolandcore_version=1.17.0

## NeroEconomy — OPTIONAL per-operation machine charges (compat/neroeconomy). compileOnly ONLY, never
## bundled: za.co.neroland.neroeconomy:neroeconomy-<loader>-<mc>:<this>, from mavenLocal() or (when
## credentials are present) NeroEconomy's GitHub Packages repo. NeroTech builds and runs without it.
neroeconomy_version=0.5.0-beta.1

## Nerospace — OPTIONAL planet-trait interop with NO build dependency of any kind:
## compat.NerospacePlanetCompat resolves the semver-stable za.co.neroland.nerospace.api facade by
## pure reflection at runtime. The loader manifests list nerospace as optional (load-order metadata
## only) and NeroTech builds and runs fully without it.

