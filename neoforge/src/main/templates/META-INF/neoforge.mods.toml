modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
logoFile = "nerotech_logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
NeroTech - multiloader build (NeoForge).
'''

[[mixins]]
config = "nerotech-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroTech (ordering = AFTER).
[[dependencies.${mod_id}]]
modId = "nerolandcore"
type = "required"
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# Energized Power — optional interop. When present it must load BEFORE NeroTech so its Forge-Energy
# capabilities and c: material tags are available; discovery is via Core tags/capabilities, never a
# hard import.
[[dependencies.${mod_id}]]
modId = "energizedpower"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Nerospace — optional planet-trait interop (Stage H). When present it must load BEFORE NeroTech so
# its nerospace.api facade is ready when machines query planet traits; discovery is runtime-guarded
# (compat.NerospacePlanetCompat), never a hard import — NeroTech runs fully without it.
[[dependencies.${mod_id}]]
modId = "nerospace"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
