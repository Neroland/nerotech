// fabric: Fabric Loom. De-obfuscated 26.x: NO `mappings` line. Shares the common
// module's source directly (single copy -> no drift).

plugins {
    id 'net.fabricmc.fabric-loom'
    id 'eclipse'   // for eclipse.synchronizationTasks (VS Code / Buildship import hook)
}

// MC version comes from the Stonecutter node (e.g. :fabric:26.1.2), not a global property.
def mc = stonecutter.current.version
def fabricApi = project.findProperty("fabric_api_version_${mc}")
def jeiVersion = project.findProperty("jei_version_${mc}")
def nerolandcoreVersion = project.findProperty('nerolandcore_version')

// This node's projectDir is <loader>/versions/<v>; the authoritative loader source +
// resources live in the BRANCH root (fabric/). Resolve branch-root paths via the parent.
def branchDir = project.parent.projectDir

// Distinct, descriptive jar name per cell (the node project is named after the MC version, so the
// default jar would be "<mc>-<version>.jar" and COLLIDE with the neoforge cell of the same version).
base { archivesName = "nerotech-fabric-${mc}" }

// Pull in the shared common source + resources.
sourceSets.main.java.srcDir rootProject.ext.commonJava
sourceSets.main.resources.srcDir rootProject.ext.commonResources

// Plain-JVM unit tests (JUnit 5, no game bootstrap) — the same shared tests the neoforge nodes run,
// so a regression is caught on every loader instead of only one. They live in common/src/test/java
// (mirroring Core's layout) but `common` is not a Gradle project (see settings.gradle), so each
// loader node wires the source dir itself.
// Loom has no equivalent of ModDevGradle's `addModdingDependenciesTo`, so the test source set simply
// inherits main's resolved classpath (de-obfuscated Minecraft + fabric-api + Core). testImplementation
// already extends implementation, which carries Core; the extendsFrom below adds Loom's Minecraft.
// Run with `gradlew :fabric:<mc>:test`; `build`/`check` runs them automatically.
sourceSets.test.java.srcDir "${rootProject.projectDir}/common/src/test/java"
configurations.testCompileClasspath.extendsFrom configurations.compileClasspath
configurations.testRuntimeClasspath.extendsFrom configurations.runtimeClasspath

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    // NOTE: no `mappings` — de-obfuscated 26.x needs none (Fabric Loom 1.17+).
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    if (fabricApi != null) {
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    // Neroland Core — REQUIRED shared foundation (machine/energy framework, progression gates, data
    // erasure). Plain `implementation` (NOT `include`) — matching how fabric-api is declared here: this
    // de-obf 26.x Loom setup omits `mappings`, so there is no intermediary→named remap and Loom's
    // `modImplementation` configuration isn't available. Core's classes land on the compile + dev-runtime
    // classpath and Fabric Loader discovers it as a mod via its bundled fabric.mod.json. Resolved from
    // mavenLocal(). Core loads BEFORE NeroTech (see fabric.mod.json depends).
    implementation "za.co.neroland.nerolandcore:nerolandcore-fabric-${mc}:${nerolandcoreVersion}"

    // Nerospace — OPTIONAL planet-trait interop (Stage H): compileOnly ONLY, so the runtime-guarded
    // compat/NerospacePlanetCompat (shared common source) compiles against the semver-stable
    // Nerospace: NO build dependency at all — compat/NerospacePlanetCompat resolves the
    // za.co.neroland.nerospace.api facade by pure reflection at runtime. fabric.mod.json only
    // `suggests` nerospace; NeroTech builds and runs fully without it.

    // Sentry SDK (telemetry/NeroTechTelemetry): compile against it + embed it as a jar-in-jar so the
    // shipped Fabric jar carries it. Counterpart to the NeoForge JarJar bundling.
    implementation 'io.sentry:sentry:8.45.0'
    include 'io.sentry:sentry:8.45.0'

    // JEI (optional recipe-viewer compat). The shared compat/jei plugin lives in `common` and uses ONLY
    // the loader-agnostic JEI common API; on Fabric it compiles against the common + fabric APIs and loads
    // against the Fabric JEI mod at dev runtime. JEI is a soft dependency (compile-time API only; the mod
    // is runtime-only). Same per-MC version as NeoForge (jei_version_<mc>, BlameJared maven from the root).
    if (jeiVersion) {
        compileOnly "mezz.jei:jei-${mc}-common-api:${jeiVersion}"
        compileOnly "mezz.jei:jei-${mc}-fabric-api:${jeiVersion}"
        runtimeOnly "mezz.jei:jei-${mc}-fabric:${jeiVersion}"
    }
}

// Expand fabric.mod.json from src/main/templates into a generated resources dir.
// The template is NOT under src/main/resources, so the IDE never copies a RAW
// (token-laden) fabric.mod.json into bin/main. eclipse.synchronizationTasks runs
// this on VS Code/Buildship import, so bin/main gets the EXPANDED manifest and
// Run & Debug works — while values stay dynamic (sourced from gradle.properties).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        mod_id               : rootProject.mod_id,
        mod_version          : rootProject.mod_version,
        mod_name             : rootProject.mod_name,
        mod_authors          : rootProject.mod_authors,
        mod_license          : rootProject.mod_license,
        fabric_loader_version: rootProject.fabric_loader_version,
        minecraft_version    : mc,
        // Floor the required Core version at what we compile against so the loader refuses to
        // run against a Core too old to have the APIs it references.
        nerolandcore_version : nerolandcoreVersion,
    ]
    inputs.properties(props)
    expand(props)
    from "${branchDir}/src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
eclipse.synchronizationTasks generateModMetadata

// Bundle the in-repo wiki/ pages as runtime classpath resources under assets/nerotech/wiki/ so the
// NeroLink `wiki` section (link.WikiLibrary) can serve them on the server. wiki/ stays the single
// source of truth; a generated index.json (slug + title per page) rides along, since classpath
// directory listing is unreliable across loaders.
def generateWikiResources = tasks.register('generateWikiResources', Copy) {
    def wikiSrcDir = file("${rootProject.projectDir}/wiki")
    from(wikiSrcDir) {
        include '*.md'
        into 'assets/nerotech/wiki'
    }
    into layout.buildDirectory.dir('generated/sources/wiki')
    doLast {
        def outDir = layout.buildDirectory.dir('generated/sources/wiki/assets/nerotech/wiki').get().asFile
        outDir.mkdirs()
        def entries = []
        wikiSrcDir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.md') }?.sort { it.name }?.each { f ->
            def slug = f.name.substring(0, f.name.length() - 3)
            def title = slug.replace('-', ' ')
            for (String line : f.readLines('UTF-8')) {
                def t = line.trim()
                if (t.startsWith('# ')) { title = t.substring(2).trim(); break }
                if (!t.isEmpty()) break
            }
            entries << [slug: slug, title: title]
        }
        def sb = new StringBuilder('{\n  "pages": [\n')
        entries.eachWithIndex { e, i ->
            sb.append('    {"slug": ').append(groovy.json.JsonOutput.toJson(e.slug))
              .append(', "title": ').append(groovy.json.JsonOutput.toJson(e.title)).append('}')
              .append(i < entries.size() - 1 ? ',' : '').append('\n')
        }
        sb.append('  ]\n}\n')
        new File(outDir, 'index.json').write(sb.toString(), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir generateWikiResources
eclipse.synchronizationTasks generateWikiResources

loom {
    accessWidenerPath = file("${branchDir}/src/main/resources/nerotech.accesswidener")

    runs {
        client {
            client()
            // Do NOT let Loom write Eclipse *.launch files — they embed absolute machine
            // paths. The committed .vscode/launch.json (relative ${workspaceFolder}) is the
            // single source of truth for run/debug.
            ideConfigGenerated false
            runDir 'runs/client'
        }
        server {
            server()
            ideConfigGenerated false
            runDir 'runs/server'
        }
    }
}

// Loom creates each run's `runDir` lazily on first launch, but VS Code opens the
// debug terminal in that cwd BEFORE the program starts — so a never-yet-run config
// fails with "Starting directory (cwd) ... does not exist". Pre-create the dirs so
// the cwd always exists. Wired into (a) the Fabric preLaunchTask `configureLaunch`
// (runs before each launch) and (b) eclipse.synchronizationTasks (fresh IDE import).
def createFabricRunDirs = tasks.register('createFabricRunDirs') {
    description = 'Pre-create Loom run directories so the IDE debug-terminal cwd exists before first launch.'
    doLast {
        file('runs/client').mkdirs()
        file('runs/server').mkdirs()
    }
}
eclipse.synchronizationTasks createFabricRunDirs
tasks.matching { it.name == 'configureLaunch' }.configureEach { dependsOn createFabricRunDirs }

// ecjCheck: run the Eclipse compiler over common + fabric main sources, with the same prefs as VS Code.
configurations {
    ecj
}
dependencies {
    ecj 'org.eclipse.jdt:ecj:+'
}
tasks.register('ecjCheck', JavaExec) {
    group = 'verification'
    description = 'Run the Eclipse (IDE) analyzer over common + fabric main sources and report its diagnostics.'
    notCompatibleWithConfigurationCache('assembles the analysis classpath at execution time')
    dependsOn tasks.named('compileJava')
    classpath = configurations.ecj
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    doFirst {
        def analysisCp = (sourceSets.main.compileClasspath.files + sourceSets.main.output.files)
                .findAll { it.exists() }
                .join(File.pathSeparator)
        def srcDirs = sourceSets.main.java.srcDirs.findAll { it.exists() }.collect { it.absolutePath }
        args = [
                '--release', '25',
                '-proc:none',
                '-d', 'none',
                '-properties', rootProject.file('tools/ecj.prefs').absolutePath,
                // No '-warn:' override — tools/ecj.prefs is the single source of truth for severities.
                // A CLI -warn:+token forces a category ON regardless of the prefs `ignore`, so the
                // framework-interop nullness categories would re-appear. nullanalysis=enabled in the
                // prefs already turns annotation-based analysis on for the genuine categories.
                '-annotationpath', 'CLASSPATH',
                '-classpath', analysisCp,
        ] + srcDirs
    }
}
